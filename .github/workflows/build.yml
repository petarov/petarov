name: README generate schedule

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate .md files
        env:
          GITHUB_TOKEN: ${{ secrets.GHTKN }}
        run: |
          go run ./cmd/v2
          go run ./cmd/v2 --gen-comments

      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md ALLCMNTS.md
          if git diff --staged --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Scheduled activity update ($(date -u +%F))"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          for i in 1 2 3; do
            git push origin HEAD && exit 0
            echo "Push rejected, rebasing (attempt $i)..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
